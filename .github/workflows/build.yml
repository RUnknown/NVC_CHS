name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        shell: powershell
        run: .\build.ps1 -SkipHostCheck

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath ..\NvcChs.dll -Destination dist\NvcChs.dll
          Copy-Item -LiteralPath NVCleanstall.exe.config -Destination dist\
          Copy-Item -LiteralPath README.md -Destination dist\
          Compress-Archive -Path dist\* -DestinationPath NvcChs.zip -Force
          Get-FileHash -LiteralPath NvcChs.zip -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NvcChs
          path: NvcChs.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME NvcChs.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME NvcChs.zip --title $env:GITHUB_REF_NAME --generate-notes
          }
